<style>
:root{--bg:#f6f4ef;--fg:#222;--mut:#6b6b6b;--card:#fff;--bd:#ddd8cc;--ac:#3d5a80;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c1f;--fg:#eee;--mut:#9a9a9a;--card:#26282c;--bd:#3a3d42;--ac:#8fb0d9}}
:root[data-theme="dark"]{--bg:#1b1c1f;--fg:#eee;--mut:#9a9a9a;--card:#26282c;--bd:#3a3d42;--ac:#8fb0d9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 Georgia,'Times New Roman',serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0}
.sub{color:var(--mut);font-size:.9rem;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
input,select,button{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
#q{flex:1 1 100%}
select{flex:1}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}
.up{background:var(--card);border:1px dashed var(--bd);border-radius:10px;padding:12px;margin:12px 0}
.up label{display:block;margin-bottom:6px;font-size:.9rem}
#msg{font-size:.9rem;color:var(--mut);margin-top:6px;min-height:1.2em}
h2{font-size:1.25rem;margin:22px 0 4px;border-bottom:2px solid var(--ac);color:var(--ac)}
h3{font-size:1rem;margin:14px 0 6px;text-transform:capitalize;color:var(--mut)}
.it{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin:6px 0}
.it b{display:block}
.it span{font-size:.88rem;color:var(--mut)}
.obs{font-style:italic}
.logo{display:flex;align-items:center;gap:12px}
.logo img{height:84px;width:84px;border-radius:8px;background:#fff;flex:none}
.it{cursor:pointer}
.ed label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 3px}
.ed input,.ed textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
.ed .row{display:flex;gap:8px}.ed .row>div{flex:1}
.ed .btns{display:flex;gap:8px;margin-top:16px}.ed .btns button{flex:1}
.ed .gr{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
[hidden]{display:none!important}
.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{flex:1;background:var(--card);color:var(--fg);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#list.stats .up,#list.stats .bar,#list.stats #cnt,#list.stats #out{display:none}
#list:not(.stats) #st{display:none}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:12px 0}
.lk{cursor:pointer}
#q,#cq{background:#fff59d;color:#222;border:3px solid #f2c200;border-radius:10px;font-size:1.1rem;padding:14px;box-shadow:0 0 0 3px rgba(242,194,0,.28)}
#q::placeholder,#cq::placeholder{color:#6d5a00}
.yb{display:flex;justify-content:space-between;align-items:center;width:100%;margin:8px 0;padding:14px 16px;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:10px;font:inherit;text-align:left}
.yb.tot{border:2px solid var(--ac);font-weight:bold}
.yb span:last-child{color:var(--mut);font-size:.9rem}
.bkb{background:transparent;color:var(--ac);border:1px solid var(--bd);margin:8px 0}
.sc.tot{border:2px solid var(--ac)}
.sc h2{margin:0 0 8px;border:0}
.sr{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.bar2{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:3px}.bar2 i{display:block;height:100%;background:var(--ac)}
.cnt{color:var(--mut);font-size:.9rem}
</style>
</head>

<script>
window.addEventListener("error",e=>{const b=document.getElementById("errbox");if(b){b.hidden=false;b.textContent="Error: "+e.message+" (línia "+e.lineno+")"}});
const MESOS=['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
const MES_ES={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};
let rows=[],db=null;
const $=id=>document.getElementById(id);
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

MESOS.forEach((n,i)=>{const o=document.createElement('option');o.value=i+1;o.textContent=n;$('m').appendChild(o)});

const TN={cos:'Cos',cendres:'Cendres',altres:'Exhumació/trasllat',restes:'Restes'};
const DN={ninxol:'Nínxol',panteo:'Panteó',columbari:'Columbari'};
function tipusOf(r){
  const t=norm(r.tipus);
  if(/^(altr|trasll|trasl|exhum)/.test(t))return 'altres';
  if(/^rest/.test(t))return 'restes';
  if(/^(cendr|ceniz)/.test(t))return 'cendres';
  if(/^(cos|cuerp)/.test(t))return 'cos';
  const x=norm((r.funer||'')+' '+(r.obs||'')),nm=norm(r.n);
  if(/exhum|trasll|traslad/.test(x))return 'altres';
  if(/\bresto|\brestes/.test(nm+' '+x))return 'restes';
  return (r.colum||/cendr|ceniz/.test(x))?'cendres':'cos';
}
function destOf(r){
  const d=norm(r.dest);
  if(d.startsWith('pante'))return 'panteo';
  if(/^(nin|nich|nic)/.test(d))return 'ninxol';
  if(d.startsWith('colum'))return 'columbari';
  if(r.colum)return 'columbari';
  if(r.panteo||/pante/.test(norm([r.niu,r.classe,r.bloc,r.obs].join(' '))))return 'panteo';
  return r.niu?'ninxol':'';
}
